services:
  - type: web
    name: homework-parser
    runtime: node
    plan: free
    buildCommand: npm ci && npm test && npm prune --omit=dev
    startCommand: npm run bot
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: ESCHOOL_USERNAME
        sync: false
      - key: ESCHOOL_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CLASSROOM_COOKIE_HEADER
        sync: false
      - key: HOMEWORK_DATABASE_URL
        sync: false
